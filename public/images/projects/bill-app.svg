<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="billBg" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1420"/>
      <stop offset="60%" stop-color="#0d1f33"/>
      <stop offset="100%" stop-color="#132c48"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentYellow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#billBg)"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="60" y1="0" x2="60" y2="480" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="480" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="340" y1="0" x2="340" y2="480" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="480" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="620" y1="0" x2="620" y2="480" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="740" y1="0" x2="740" y2="480" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Left Card: Bill Calculator & Summary -->
  <g transform="translate(60, 50)">
    <rect width="360" height="380" rx="18" fill="#111c2a" fill-opacity="0.9" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    
    <!-- Header -->
    <circle cx="36" cy="38" r="16" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="36" y="44" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="16" font-weight="900" text-anchor="middle">⚡</text>
    <text x="64" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Electricity Bill Estimator</text>
    <text x="64" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">FESCO / WAPDA Slabs &amp; Taxes</text>
    
    <!-- Total Amount Box -->
    <rect x="24" y="74" width="312" height="90" rx="14" fill="#18273a" stroke="rgba(234, 179, 8, 0.3)"/>
    <text x="44" y="104" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ESTIMATED PAYABLE</text>
    <text x="44" y="142" fill="#eab308" font-family="system-ui, sans-serif" font-size="32" font-weight="800">PKR 14,850</text>
    <text x="260" y="140" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">-6% vs Prev</text>

    <!-- Slab Rows -->
    <g transform="translate(24, 184)">
      <rect width="312" height="42" rx="10" fill="#142132"/>
      <text x="16" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Units Consumed (kWh)</text>
      <text x="296" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="end">348 Units</text>
    </g>

    <g transform="translate(24, 236)">
      <rect width="312" height="42" rx="10" fill="#142132"/>
      <text x="16" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Tariff Slab (301 - 700)</text>
      <text x="296" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="end">Rs. 38.5 / Unit</text>
    </g>

    <g transform="translate(24, 288)">
      <rect width="312" height="42" rx="10" fill="#142132"/>
      <text x="16" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Fuel Adjustment &amp; Taxes</text>
      <text x="296" y="26" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="end">+ PKR 2,450</text>
    </g>

    <!-- Status Button -->
    <rect x="24" y="340" width="312" height="28" rx="8" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="180" y="358" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✔ Accurate Slab Calculation Verified</text>
  </g>

  <!-- Right Side: Usage Analytics Wave & Quick Stats -->
  <g transform="translate(450, 50)">
    <!-- Card Top: Monthly Consumption Bar Chart -->
    <rect width="290" height="210" rx="18" fill="#111c2a" fill-opacity="0.9" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <text x="24" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">6-Month Trend</text>
    <text x="24" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Peak vs Off-Peak load analysis</text>
    
    <!-- Chart Bars -->
    <g transform="translate(24, 80)">
      <!-- May -->
      <rect x="10" y="50" width="24" height="60" rx="4" fill="#334155"/>
      <text x="22" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">May</text>
      <!-- Jun -->
      <rect x="52" y="25" width="24" height="85" rx="4" fill="#334155"/>
      <text x="64" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Jun</text>
      <!-- Jul -->
      <rect x="94" y="10" width="24" height="100" rx="4" fill="#ef4444"/>
      <text x="106" y="125" fill="#ef4444" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Jul</text>
      <!-- Aug -->
      <rect x="136" y="20" width="24" height="90" rx="4" fill="#f59e0b"/>
      <text x="148" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Aug</text>
      <!-- Sep -->
      <rect x="178" y="45" width="24" height="65" rx="4" fill="#06b6d4"/>
      <text x="190" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Sep</text>
      <!-- Oct -->
      <rect x="220" y="58" width="24" height="52" rx="4" fill="#10b981"/>
      <text x="232" y="125" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Oct</text>
    </g>

    <!-- Card Bottom: Energy Saving Tips -->
    <g transform="translate(0, 230)">
      <rect width="290" height="150" rx="18" fill="#111c2a" fill-opacity="0.9" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
      <text x="24" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Smart Features</text>
      
      <circle cx="34" cy="62" r="5" fill="#eab308"/>
      <text x="50" y="66" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Instant PDF bill download</text>

      <circle cx="34" cy="92" r="5" fill="#06b6d4"/>
      <text x="50" y="96" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Reference Number 14-Digit Auto Lookup</text>

      <circle cx="34" cy="122" r="5" fill="#10b981"/>
      <text x="50" y="126" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Multi-provider tariff calculator</text>
    </g>
  </g>
</svg>
