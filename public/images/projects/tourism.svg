<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1b2b"/>
      <stop offset="50%" stop-color="#14344d"/>
      <stop offset="100%" stop-color="#2a5870"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#ff7a18"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#192a3a"/>
      <stop offset="100%" stop-color="#0a121a"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c4c66"/>
      <stop offset="100%" stop-color="#10202e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#skyGrad)"/>
  
  <!-- Ambient Stars & Glow -->
  <circle cx="120" cy="80" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="280" cy="50" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="450" cy="90" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="650" cy="60" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="720" cy="110" r="2" fill="#fff" opacity="0.6"/>
  
  <!-- Glowing Sun/Moon on Horizon -->
  <circle cx="400" cy="220" r="70" fill="url(#sunGrad)" opacity="0.9"/>
  <circle cx="400" cy="220" r="100" fill="#ff9933" opacity="0.15"/>
  
  <!-- Distant Mountains -->
  <path d="M 120 340 L 260 170 L 400 340 Z" fill="url(#mountain2)" opacity="0.8"/>
  <path d="M 330 340 L 480 140 L 640 340 Z" fill="url(#mountain2)" opacity="0.85"/>
  <path d="M 480 140 L 530 200 L 480 230 L 440 190 Z" fill="#ffffff" opacity="0.25"/>
  
  <!-- Foreground Mountains -->
  <path d="M -50 480 L 150 250 L 380 480 Z" fill="url(#mountain1)"/>
  <path d="M 150 250 L 190 310 L 160 340 L 120 300 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M 280 480 L 520 230 L 760 480 Z" fill="url(#mountain1)"/>
  <path d="M 520 230 L 570 300 L 530 330 L 480 290 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M 580 480 L 720 290 L 850 480 Z" fill="url(#mountain1)"/>

  <!-- UI Overlay: Glass Booking Bar -->
  <g transform="translate(100, 360)">
    <rect width="600" height="74" rx="18" fill="#0d1924" fill-opacity="0.85" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <!-- Search item 1 -->
    <text x="32" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">LOCATION</text>
    <text x="32" y="53" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Hunza &amp; Skardu, PK</text>
    <!-- Divider -->
    <line x1="220" y1="20" x2="220" y2="54" stroke="rgba(255,255,255,0.15)"/>
    <!-- Search item 2 -->
    <text x="245" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">EXPEDITION DATE</text>
    <text x="245" y="53" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">7 Days Package</text>
    <!-- Button -->
    <rect x="440" y="16" width="138" height="42" rx="12" fill="#eab308"/>
    <text x="509" y="42" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="750" text-anchor="middle">Explore Tours →</text>
  </g>
  
  <!-- Floating Badge Top Left -->
  <g transform="translate(50, 40)">
    <rect width="180" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.2)"/>
    <circle cx="24" cy="21" r="7" fill="#10b981"/>
    <text x="42" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Tourism &amp; Travel Hub</text>
  </g>
  
  <!-- Rating Badge Top Right -->
  <g transform="translate(610, 40)">
    <rect width="140" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255,255,255,0.2)"/>
    <text x="30" y="26" fill="#eab308" font-family="system-ui, sans-serif" font-size="16">★</text>
    <text x="50" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4.9 / 5.0 (Tours)</text>
  </g>
</svg>
