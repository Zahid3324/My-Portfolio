<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clothBg" x1="0" y1="0" x2="800" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181512"/>
      <stop offset="50%" stop-color="#241e18"/>
      <stop offset="100%" stop-color="#14110e"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa771c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#clothBg)"/>

  <!-- Fashion Store Navigation Bar -->
  <g transform="translate(60, 40)">
    <rect width="680" height="50" rx="12" fill="#1e1813" stroke="rgba(255,255,255,0.08)"/>
    <text x="30" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900" letter-spacing="2">AURA · APPAREL</text>
    <text x="260" y="31" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">MEN</text>
    <text x="320" y="31" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">WOMEN</text>
    <text x="400" y="31" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">COLLECTION</text>
    <text x="520" y="31" fill="#d4af37" font-family="system-ui, sans-serif" font-size="13" font-weight="700">SALE (20%)</text>
    <circle cx="630" cy="25" r="14" fill="#2d241c"/>
    <text x="630" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">🛍 2</text>
  </g>

  <!-- Left Product Hero Card -->
  <g transform="translate(60, 110)">
    <rect width="360" height="320" rx="16" fill="#1f1914" stroke="rgba(255,255,255,0.08)"/>
    
    <!-- Garment Visual representation -->
    <rect x="30" y="30" width="140" height="180" rx="12" fill="#2e251e"/>
    <!-- Stylized minimalist hoodie/jacket shape -->
    <path d="M 65 60 C 80 50, 120 50, 135 60 L 155 90 L 140 100 L 130 80 L 130 180 L 70 180 L 70 80 L 60 100 L 45 90 Z" fill="#d4af37" opacity="0.85"/>
    <circle cx="100" cy="55" r="10" fill="#1f1914"/>

    <!-- Product Info Right of Image -->
    <text x="190" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">NEW ARRIVAL</text>
    <text x="190" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Oversized Heavyweight Hoodie</text>
    <text x="190" y="115" fill="#d4af37" font-family="system-ui, sans-serif" font-size="18" font-weight="800">PKR 4,200</text>
    <text x="190" y="135" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" text-decoration="line-through">PKR 5,500</text>

    <!-- Size selector -->
    <text x="190" y="165" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">SIZE: S · M · L · XL</text>
    
    <!-- Color Swatches -->
    <circle cx="200" cy="190" r="8" fill="#111827" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="225" cy="190" r="8" fill="#52525b"/>
    <circle cx="250" cy="190" r="8" fill="#d4af37"/>

    <!-- Add to cart button -->
    <rect x="30" y="240" width="300" height="48" rx="12" fill="#d4af37"/>
    <text x="180" y="270" fill="#181512" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Add to Bag — Fast Checkout</text>
  </g>

  <!-- Right Side Grid Items -->
  <g transform="translate(440, 110)">
    <!-- Feature 1 -->
    <rect width="300" height="96" rx="14" fill="#1f1914" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="44" cy="48" r="20" fill="rgba(212, 175, 55, 0.15)"/>
    <text x="44" y="55" fill="#d4af37" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">⚡</text>
    <text x="80" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Dynamic Product Catalog</text>
    <text x="80" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Instant category filtering, search &amp; sort</text>

    <!-- Feature 2 -->
    <g transform="translate(0, 112)">
      <rect width="300" height="96" rx="14" fill="#1f1914" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="44" cy="48" r="20" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="44" y="55" fill="#10b981" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">🛒</text>
      <text x="80" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Cart &amp; Order Persistence</text>
      <text x="80" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Local storage + MongoDB sync order state</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(0, 224)">
      <rect width="300" height="96" rx="14" fill="#1f1914" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="44" cy="48" r="20" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="44" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">📱</text>
      <text x="80" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Mobile Responsive UX</text>
      <text x="80" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Silky smooth on phones, tablets &amp; desktop</text>
    </g>
  </g>
</svg>
